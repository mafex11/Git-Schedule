[workspace]
resolver = "2"
members = ["shared", "cli", "daemon"]

[workspace.package]
version = "0.1.8"
edition = "2021"
authors = ["mafex"]
license = "MIT"
repository = "https://github.com/mafex/git-schedule"

[workspace.dependencies]
# Shared dependencies
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# Git
git2 = "0.19"

# CLI specific
clap = { version = "4", features = ["derive"] }
console = "0.15"
dialoguer = "0.11"
ureq = "2"
semver = "1"

# Daemon specific
notify-rust = "4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
